<!DOCTYPE html>
<html lang="en">
<head>
<title>Bootstrap Example</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.4/dist/jquery.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>


<div class="container">


<form action="/savedata" method="POST" enctype="multipart/form-data">
<div>
<label for="formFileLg" class="form-label">Upload File</label>
<input class="form-control form-control-lg" id="formFileLg" type="file" name="the_file">
</div>
<div>

<button type="submit" class="btn btn-primary">Upload</button> <br />
<a href="listfiles" class="btn btn-primary">View All Available files</a>
</div>

</form>

</div>


</body>
</html>
